[project]
name = "docpin"
version = "0.1.0"
description = "Pin notes on the HTML documents Claude Code writes, in your browser; the notes flow back to the live session that wrote them"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude-code", "annotation", "html", "review"]
# No runtime dependency, on purpose: the daemon is `http.server`, the config is
# `tomllib`, the registry is `json`. See CLAUDE.md, "Invariants".
dependencies = []

[project.urls]
Homepage = "https://github.com/elphono/docpin"
Issues = "https://github.com/elphono/docpin/issues"

[project.scripts]
annotate = "annotate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/annotate"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.mypy]
files = ["src/annotate", "tools", "hooks"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "browser: drives a real headless Chromium through Playwright (run explicitly: -m browser)",
]
addopts = "-m 'not browser'"

# Same rule set as remarkable-sync, for the same reason: the set the repository
# keeps GREEN. E501 is left out (prompt templates and shell lines are long by
# nature), I (import order) too.
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W"]
